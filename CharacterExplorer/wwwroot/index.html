<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Holocron // Character Datapad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root { --ink:#edf3f5; --muted:#91a3a8; --line:#2a3e43; --cyan:#43d6d1; --yellow:#f4c95d; --bg:#071316; --panel:#0d2024; }
      * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 60% -10%,#173b40 0,#071316 43%); font-family:"Barlow Condensed",sans-serif }
      body:before { content:""; position:fixed; inset:0; opacity:.035; pointer-events:none; background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px); background-size:4px 4px }
      button,input { font:inherit } button { cursor:pointer }
      .top { min-height:76px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 clamp(22px,5vw,72px); border-bottom:1px solid var(--line); background:#08181bde }
      .brand { display:flex; align-items:center; gap:10px; color:var(--ink); letter-spacing:2px; font-size:23px; font-weight:600 }.brand span { color:var(--cyan) }.brand .eyebrow { margin-left:8px }
      .eyebrow { color:var(--cyan); font:10px "Space Mono"; letter-spacing:2px; text-transform:uppercase }
      .search { display:flex; align-items:center; gap:8px; width:min(280px,42vw); padding:0 12px; border:1px solid var(--line); background:#091b1e; color:var(--cyan) }.search input { width:100%; height:38px; border:0; outline:0; background:none; color:var(--ink); font:12px "Space Mono" }
      .layout { display:grid; grid-template-columns:280px 1fr; gap:26px; max-width:1240px; margin:34px auto; padding:0 28px }.side h3 { margin:0 0 10px }.side-list { height:600px; overflow:auto; border:1px solid var(--line); background:#09191c }.person-button { display:block; width:100%; padding:11px 14px; border:0; border-bottom:1px solid #183035; background:none; color:#afc0c3; text-align:left; font:14px "Barlow Condensed" }.person-button:hover,.person-button.active { background:#15383d; color:var(--cyan) }.person-button.active { padding-left:11px; border-left:3px solid var(--cyan) }
      .main { min-width:0 }.card { padding:26px; border:1px solid var(--line); background:#0b1d21e8 }.hero { display:flex; align-items:center; gap:18px; margin-bottom:25px; padding-bottom:22px; border-bottom:1px solid var(--line) }.avatar { width:58px; height:58px; display:grid; place-items:center; border:1px solid var(--cyan); border-radius:50%; color:var(--cyan); font-size:27px }.hero h1 { margin:0; font-size:32px; letter-spacing:1px }.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:20px }.section-title { margin:0 0 10px; color:var(--yellow); font:11px "Space Mono"; letter-spacing:1px; text-transform:uppercase }.facts { border:1px solid var(--line) }.fact { display:flex; justify-content:space-between; gap:14px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px }.fact:last-child { border-bottom:0 }.fact label { color:var(--muted) }.fact b { text-align:right; font-weight:500 }
      .related { margin-top:25px }.film-row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px }.film { min-height:107px; display:flex; flex-direction:column; justify-content:center; gap:7px; padding:14px 8px; border:1px solid var(--line); color:#607377; text-align:center }.film.seen { border-color:var(--cyan); background:#103037; color:var(--ink) }.film .ep { color:var(--cyan); font:10px "Space Mono" }.film small { color:var(--cyan); font:10px "Space Mono" }.lists { display:grid; grid-template-columns:1fr 1fr; gap:26px }.item { display:flex; align-items:center; gap:12px; min-height:68px; margin-top:10px; padding:12px; border:1px solid var(--line); background:#09191c }.thumb { width:38px; height:38px; display:grid; place-items:center; flex:none; color:var(--cyan); border:1px solid #31565b }.item strong { display:block; color:var(--cyan); font-size:16px }.item small { display:block; margin-top:5px; color:var(--muted); font:10px "Space Mono" }.state { padding:35px; border:1px solid var(--line); color:var(--muted); text-align:center; font:12px "Space Mono" }.error { color:#ff8d82; border-color:#6b302c }
      @media (max-width:900px) { .layout { grid-template-columns:1fr }.side-list { height:180px }.grid3,.lists { grid-template-columns:1fr }.film-row { grid-template-columns:repeat(3,1fr) } }
      @media (max-width:500px) { .top { height:auto; flex-wrap:wrap; padding:18px; gap:14px }.search { width:100% }.layout { margin-top:20px; padding:0 16px }.card { padding:16px }.film-row { grid-template-columns:repeat(2,1fr) } }
    </style>
  </head>
  <body><div id="root"></div><script type="text/babel" src="/app.jsx"></script></body>
</html>
